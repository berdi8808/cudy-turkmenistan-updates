name: Publish Cudy APK release

on:
  push:
    branches: [main]
    paths:
      - update.json
      - .github/workflows/publish-apk-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify full APK
        shell: bash
        run: |
          set -euo pipefail
          cat release-assets/v2.4.2/part-*.bin > Cudy_Turkmenistan.apk
          expected_sha="$(python3 -c 'import json; print(json.load(open("update.json"))["sha256"])')"
          expected_size=6001179
          actual_size="$(stat -c '%s' Cudy_Turkmenistan.apk)"
          test "$actual_size" = "$expected_size"
          echo "$expected_sha  Cudy_Turkmenistan.apk" | sha256sum --check -
      - name: Create release and upload verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.4.2 Cudy_Turkmenistan.apk \
            --target "$GITHUB_SHA" \
            --title "Cudy Turkmenistan 2.4.2" \
            --notes "Improved category navigation, larger product cards and photos. Full APK size and SHA-256 verified before release."
