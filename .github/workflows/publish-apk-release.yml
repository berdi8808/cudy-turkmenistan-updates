name: Publish Cudy APK release

on:
  push:
    branches: [main]
    paths:
      - update.json

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify full APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t release_info < <(python3 - <<'PY'
          import json
          manifest = json.load(open("update.json", encoding="utf-8"))
          print(manifest["versionName"])
          print(manifest["sha256"])
          print(manifest.get("releaseNotes", {}).get("ru", ""))
          print(manifest.get("releaseNotes", {}).get("tk", ""))
          PY
          )
          version="${release_info[0]}"
          tag="v${version}"
          expected_sha="${release_info[1]}"
          shopt -s nullglob
          parts=(release-assets/"${tag}"/part-*.bin)
          test "${#parts[@]}" -gt 0
          cat "${parts[@]}" > Cudy_Turkmenistan.apk
          echo "${expected_sha}  Cudy_Turkmenistan.apk" | sha256sum --check -

          notes="RU: ${release_info[2]}

          TK: ${release_info[3]}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          echo "NOTES<<RELEASE_NOTES" >> "$GITHUB_ENV"
          printf '%s\n' "$notes" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES" >> "$GITHUB_ENV"
      - name: Create release and upload verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" Cudy_Turkmenistan.apk \
            --target "$GITHUB_SHA" \
            --title "Cudy Turkmenistan $VERSION" \
            --notes "$NOTES"
