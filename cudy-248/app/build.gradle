import java.util.Properties
plugins { id 'com.android.application' }
def signingProps = new Properties()
def signingPropsFile = rootProject.file('release-signing.properties')
if (signingPropsFile.exists()) signingPropsFile.withInputStream { signingProps.load(it) }
def hasReleaseKey = signingPropsFile.exists() && signingProps.getProperty('storePassword') && signingProps.getProperty('keyPassword')
android {
 namespace 'com.cudy.installer'
 compileSdk 35
 defaultConfig { applicationId 'com.cudy.installer.v22'; minSdk 23; targetSdk 34; versionCode 12; versionName '2.4.8' }
 signingConfigs {
  release {
   enableV1Signing true
   enableV2Signing true
   enableV3Signing true
   if (hasReleaseKey) {
    storeFile new File(signingPropsFile.parentFile, signingProps.getProperty('storeFile'))
    storePassword signingProps.getProperty('storePassword')
    keyAlias signingProps.getProperty('keyAlias')
    keyPassword signingProps.getProperty('keyPassword')
   }
  }
 }
 buildTypes { release { minifyEnabled false; if (hasReleaseKey) signingConfig signingConfigs.release } }
}
